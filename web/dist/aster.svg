    <clipPath id="squircleClip">
      <rect x="32" y="32" width="960" height="960" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <!-- Squircle background -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Lotus / network emblem -->
