listen: 127.0.0.1:8080
admin_listen: 127.0.0.1:9090

# Enforce blocks on the first matching rule. Use shadow while tuning.
mode: enforce

# Direct peers in these CIDRs may supply X-Forwarded-For. Leave empty when the
# proxy is the edge; otherwise any client can spoof its source address.
trusted_proxies: []

sites:
  - host: app.example.com
    upstream: http://127.0.0.1:3000
    max_body_bytes: 1048576
    health_path: /
  - host: "*.example.com"
    upstream: http://127.0.0.1:3001
    mode: shadow
    max_body_bytes: 1048576
    health_path: /
