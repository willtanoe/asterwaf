database: data/asterwaf.db
listen: 127.0.0.1:8080
admin_listen: 127.0.0.1:9090

# Enforce blocks on the first matching rule. Use shadow while tuning.
mode: enforce

# Direct peers in these CIDRs may supply X-Forwarded-For. Leave empty when the
# proxy is the edge; otherwise any client can spoof its source address.
trusted_proxies: []

sites:
  - host: app.example.com
    upstream: http://127.0.0.1:3000
    max_body_bytes: 1048576
    health_path: /
  - host: "*.example.com"
    upstream: http://127.0.0.1:3001
    mode: shadow
    max_body_bytes: 1048576
    health_path: /

# Request headers evaluated by rules. Headers not listed here are ignored.
inspect_headers:
  - User-Agent
  - Referer
  - X-Forwarded-For

# Access lists are seeded from YAML only when the database table is empty.
access_lists:
  allow_only: false
  entries:
    - id: office
      action: allow
      address: 203.0.113.0/24
      note: office network
      enabled: true
    - id: blocked-host
      action: deny
      address: 198.51.100.9
      enabled: true

# Per-IP token bucket. IPv6 addresses are grouped by /64. Restarts clear buckets.
rate_limit:
  enabled: false
  requests_per_minute: 600
  burst: 100
